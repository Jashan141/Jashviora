        store: "Amazon India",

        image: "",
        description: "",
        isTrending: false,
        isFeatured: false,
        tags: ""
      });
      const [adminTab, setAdminTab] = useState("list"); // 'list' | 'add'

      // Toast notification
      const [toast, setToast] = useState(null);

      const showToast = (message, type = "success") => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3800);
      };

      // Load products from API on mount
      useEffect(() => {
        fetch('/api/products')
          .then(res => res.json())
          .then(data => {
            if (data && data.success && Array.isArray(data.products) && data.products.length > 0) {
              setProducts(data.products);
              localStorage.setItem('jv_products', JSON.stringify(data.products));
            }
          })
          .catch(err => {
            console.log("Using cached/local products catalog:", err);
          });

        fetch('/api/pins')
          .then(res => res.json())
          .then(data => {
            if (data && data.success && Array.isArray(data.pins)) {
              setPins(data.pins);
            }
          })
          .catch(() => {});
      }, []);

      // Synchronize wishlist to localStorage
      useEffect(() => {
        localStorage.setItem('jv_wishlist', JSON.stringify(wishlist));
      }, [wishlist]);

      // Initialize Lucide icons on DOM updates
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const toggleWishlist = (productId, e) => {
        if (e) e.stopPropagation();
        setWishlist(prev => {
          if (prev.includes(productId)) {
            showToast("Removed from your saved finds.", "info");
            return prev.filter(id => id !== productId);
          } else {
            showToast("Saved to your Jashviora collection!");
            return [...prev, productId];
          }
        });
      };

      // Filtered & Sorted Products
      const filteredProducts = useMemo(() => {
        return products.filter(product => {
          const matchCat = selectedCategory === "All" || product.category.toLowerCase() === selectedCategory.toLowerCase();
          const matchStore = selectedStore === "All" || product.store.toLowerCase() === selectedStore.toLowerCase();
          const matchQuery = !searchQuery.trim() || 
            product.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
            product.description.toLowerCase().includes(searchQuery.toLowerCase()) ||
            (product.tags && product.tags.some(t => t.toLowerCase().includes(searchQuery.toLowerCase())));
          return matchCat && matchStore && matchQuery;
        }).sort((a, b) => {
          if (sortBy === "price-low") return (a.price || 0) - (b.price || 0);
          if (sortBy === "price-high") return (b.price || 0) - (a.price || 0);
          if (sortBy === "rating") return (b.rating || 0) - (a.rating || 0);
          // default trending
          return (b.isTrending === true ? 1 : 0) - (a.isTrending === true ? 1 : 0);
        });
      }, [products, selectedCategory, selectedStore, searchQuery, sortBy]);

      // Filtered Pins
      const filteredPins = useMemo(() => {
        if (pinCategory === "All") return pins;
        return pins.filter(p => p.category.toLowerCase() === pinCategory.toLowerCase());
      }, [pins, pinCategory]);

      // Admin Handlers
      const handleAdminFormChange = (e) => {
        const { name, value, type, checked } = e.target;
        setAdminForm(prev => ({
          ...prev,
          [name]: type === 'checkbox' ? checked : value
        }));
      };

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        // Try server upload first
        const formData = new FormData();
        formData.append('file', file);
        fetch('/api/upload', {
          method: 'POST',
          body: formData
        })
        .then(res => res.json())
        .then(data => {
          if (data.success && data.url) {
            setAdminForm(prev => ({ ...prev, image: data.url }));
            showToast("Image uploaded successfully!");
          } else {
            // Local base64 fallback
            const reader = new FileReader();
            reader.onloadend = () => {
              setAdminForm(prev => ({ ...prev, image: reader.result }));
              showToast("Image loaded as preview!");
            };
            reader.readAsDataURL(file);
          }
        })
        .catch(() => {
          const reader = new FileReader();
          reader.onloadend = () => {
            setAdminForm(prev => ({ ...prev, image: reader.result }));
            showToast("Image loaded offline!");
          };
          reader.readAsDataURL(file);
        });
      };

      const handleSaveProduct = (e) => {
        e.preventDefault();
        if (!adminForm.title.trim()) {
          showToast("Please enter a product name", "error");
          return;
        }

        const payload = {
          ...adminForm,
          price: parseFloat(adminForm.price) || 0,
          originalPrice: adminForm.originalPrice ? parseFloat(adminForm.originalPrice) : null,
          tags: typeof adminForm.tags === 'string' ? adminForm.tags.split(',').map(s => s.trim()).filter(Boolean) : adminForm.tags
        };

        if (editingProduct) {
          // Update via API with fallback
          fetch(`/api/products/${editingProduct.id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          })
          .then(res => res.json())
          .then(data => {
            if (data.success) {
              setProducts(prev => prev.map(p => p.id === editingProduct.id ? data.product : p));
              localStorage.setItem('jv_products', JSON.stringify(products.map(p => p.id === editingProduct.id ? data.product : p)));
              showToast("Product updated successfully!");
            }
          })
          .catch(() => {
            // local update
            const updated = { ...editingProduct, ...payload };
            setProducts(prev => {
              const next = prev.map(p => p.id === editingProduct.id ? updated : p);
              localStorage.setItem('jv_products', JSON.stringify(next));
              return next;
            });
            showToast("Product updated locally!");
          });

          setEditingProduct(null);
        } else {
          // Create new product
          fetch('/api/products', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          })
          .then(res => res.json())
          .then(data => {
            if (data.success) {
              setProducts(prev => [data.product, ...prev]);
              localStorage.setItem('jv_products', JSON.stringify([data.product, ...products]));
              showToast("New product added to catalog!");
            }
          })
          .catch(() => {
            const newProd = {
              ...payload,
              id: `jv-${Date.now()}`,
              rating: 4.9,
              reviewsCount: 1,
              storeBadgeColor: "#49372F",
              fallbackImage: "public/assets/collections/beauty.jpg"
            };
            setProducts(prev => {
              const next = [newProd, ...prev];
              localStorage.setItem('jv_products', JSON.stringify(next));
              return next;
            });
            showToast("Product saved locally!");
          });
        }

        // Reset form
        setAdminForm({
          title: "",
          category: "Beauty",
          price: "",
          originalPrice: "",
          store: "Amazon India",
          externalUrl: "",
          image: "",
          description: "",
          isTrending: false,
          isFeatured: false,
          tags: ""
        });
        setAdminTab("list");
      };

      const startEditProduct = (prod) => {
        setEditingProduct(prod);
        setAdminForm({
          title: prod.title || "",
          category: prod.category || "Beauty",
          price: prod.price || "",
          originalPrice: prod.originalPrice || "",
          store: prod.store || "Amazon India",
          externalUrl: prod.externalUrl || "",
          image: prod.image || "",
          description: prod.description || "",
          isTrending: !!prod.isTrending,
          isFeatured: !!prod.isFeatured,
          tags: Array.isArray(prod.tags) ? prod.tags.join(", ") : (prod.tags || "")
        });
        setAdminTab("add");
      };

      const handleDeleteProduct = (id) => {
        if (!confirm("Are you sure you want to delete this product from JASHVIORA?")) return;

        fetch(`/api/products/${id}`, { method: 'DELETE' })
          .then(() => {
            setProducts(prev => {
              const next = prev.filter(p => p.id !== id);
              localStorage.setItem('jv_products', JSON.stringify(next));
              return next;
            });
            showToast("Product deleted successfully.");
          })
          .catch(() => {
            setProducts(prev => {
              const next = prev.filter(p => p.id !== id);
              localStorage.setItem('jv_products', JSON.stringify(next));
              return next;
            });
            showToast("Product deleted from local storage.");
          });
      };

      const handleResetCatalog = () => {
        if (!confirm("Reset entire catalog to original curated defaults? Any custom added items will be restored.")) return;
        fetch('/api/products/reset', { method: 'POST' })
          .then(res => res.json())
          .then(data => {
            setProducts(DEFAULT_PRODUCTS);
            localStorage.setItem('jv_products', JSON.stringify(DEFAULT_PRODUCTS));
            showToast("Catalog successfully reset to default curated finds!");
          })
          .catch(() => {
            setProducts(DEFAULT_PRODUCTS);
            localStorage.setItem('jv_products', JSON.stringify(DEFAULT_PRODUCTS));
            showToast("Reset to defaults (offline).");
          });
      };

      const exportCatalogJSON = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(products, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `jashviora_catalog_${Date.now()}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        showToast("Catalog exported as JSON backup!");
      };

      // Newsletter form submission
      const [newsletterEmail, setNewsletterEmail] = useState("");
      const [newsletterDone, setNewsletterDone] = useState(false);

      const handleNewsletterSubmit = (e) => {
        e.preventDefault();
        if (!newsletterEmail || !newsletterEmail.includes("@")) {
          showToast("Please enter a valid email address.", "error");
          return;
        }

        fetch('/api/newsletter', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: newsletterEmail })
        })
        .then(res => res.json())
        .then(data => {
          setNewsletterDone(true);
          showToast(data.message || "Thank you for joining JASHVIORA!");
          setNewsletterEmail("");
        })
        .catch(() => {
          setNewsletterDone(true);
          showToast("Welcome to JASHVIORA inspirations!");
          setNewsletterEmail("");
        });
      };

      // Smooth scroll navigation
      const navigateTo = (sectionId, category = null) => {
        setIsAdminView(false);
        setIsMobileMenuOpen(false);
        if (category) {
          setSelectedCategory(category);
        }
        setTimeout(() => {
          const el = document.getElementById(sectionId);
          if (el) {
            el.scrollIntoView({ behavior: 'smooth' });
          }
        }, 50);
      };

      // Like pin handler
      const handleLikePin = (pinId, e) => {
        e.stopPropagation();
        setPins(prev => prev.map(p => {
          if (p.id === pinId) {
            return { ...p, likes: (p.likes || 0) + 1, userLiked: true };
          }
          return p;
        }));
        showToast("Inspiration saved to your moodboard!");
      };

      return (
        <div className="min-h-screen flex flex-col bg-[#FFF9F2] text-[#49372F] selection:bg-[#EBCFD0] selection:text-[#49372F]">
          
          {/* Top Announcement Bar */}
          <div className="bg-[#49372F] text-[#FFF9F2] text-xs py-2 px-4 text-center tracking-editorial font-medium flex items-center justify-center gap-2">
            <span>âœ¨ CURATED EDITORIAL DISCOVERY â€¢ BEAUTY, FASHION, JEWELLERY & HOME</span>
            <span className="hidden md:inline text-[#EBCFD0]">â€¢ ALL EXTERNAL SHOPPING LINKS VERIFIED</span>
          </div>

          {/* Sticky Luxury Header */}
          <header className="sticky top-0 z-40 header-glass transition-all">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
              
              {/* Brand Logo & Tagline */}
              <div 
                onClick={() => { setIsAdminView(false); window.scrollTo({ top: 0, behavior: 'smooth' }); }} 
                className="cursor-pointer flex items-center gap-3 group"
              >
                <div className="w-9 h-9 rounded-full bg-[#EBCFD0]/40 border border-[#E9DCCF] flex items-center justify-center p-1.5 transition-transform group-hover:scale-105">
                  <img src="public/assets/logo-icon.svg" alt="Jashviora Emblem" className="w-full h-full object-contain" />
                </div>
                <div>
                  <span className="font-serif text-2xl sm:text-3xl font-bold tracking-editorial text-[#49372F] block leading-none">
                    JASHVIORA
                  </span>
                  <span className="text-[9px] tracking-wide-editorial uppercase text-[#49372F]/70 block mt-1 font-medium">
                    Curated Style & Living
                  </span>
                </div>
              </div>

              {/* Desktop Navigation */}
              <nav className="hidden lg:flex items-center space-x-7 text-sm font-medium tracking-wide">
                <button onClick={() => navigateTo('home')} className="hover:text-[#C5A059] transition-colors py-1">Home</button>
                <button onClick={() => navigateTo('trending-finds', 'Beauty')} className="hover:text-[#C5A059] transition-colors py-1">Beauty</button>
                <button onClick={() => navigateTo('trending-finds', 'Fashion')} className="hover:text-[#C5A059] transition-colors py-1">Fashion</button>
                <button onClick={() => navigateTo('trending-finds', 'Jewellery')} className="hover:text-[#C5A059] transition-colors py-1">Jewellery</button>
                <button onClick={() => navigateTo('trending-finds', 'Home Decor')} className="hover:text-[#C5A059] transition-colors py-1">Home Decor</button>
                <button onClick={() => navigateTo('how-it-works')} className="hover:text-[#C5A059] transition-colors py-1">How It Works</button>
                <button onClick={() => navigateTo('pinterest-gallery')} className="hover:text-[#C5A059] transition-colors py-1">Inspiration</button>
                <button onClick={() => navigateTo('about-us')} className="hover:text-[#C5A059] transition-colors py-1">About Us</button>
                <button onClick={() => setIsContactModalOpen(true)} className="hover:text-[#C5A059] transition-colors py-1">Contact</button>
              </nav>

              {/* Action Buttons: Search, Wishlist, Curator Studio */}
              <div className="flex items-center space-x-2 sm:space-x-3">
                
                {/* Search Icon */}
                <button 
                  onClick={() => setIsSearchOpen(true)}
                  className="p-2.5 rounded-full hover:bg-[#E9DCCF]/50 text-[#49372F] transition-colors relative"
                  title="Search curated finds"
                  aria-label="Search"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>

                {/* Wishlist Saved Items */}
                <button 
                  onClick={() => setIsWishlistOpen(true)}
                  className="p-2.5 rounded-full hover:bg-[#E9DCCF]/50 text-[#49372F] transition-colors relative"
                  title="View saved wishlist"
                  aria-label="Wishlist"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill={wishlist.length > 0 ? "#EBCFD0" : "none"} stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>
                  {wishlist.length > 0 && (
                    <span className="absolute -top-1 -right-1 bg-[#49372F] text-[#FFF9F2] text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-bold">
                      {wishlist.length}
                    </span>
                  )}
                </button>

                {/* Admin Management Toggle */}
                <button
                  onClick={() => setIsAdminView(!isAdminView)}
                  className={`text-xs px-3.5 py-2 rounded-full border transition-all flex items-center gap-1.5 ${
                    isAdminView 
                      ? 'bg-[#49372F] text-[#FFF9F2] border-[#49372F]' 
                      : 'bg-white/80 border-[#E9DCCF] text-[#49372F] hover:border-[#49372F]'
                  }`}
                  title="Product Management Studio"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                  <span className="hidden sm:inline font-medium">{isAdminView ? "Exit Admin" : "Manage Products"}</span>
                </button>

                {/* Mobile Menu Toggle */}
                <button
                  onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)}
                  className="lg:hidden p-2 rounded-lg text-[#49372F] hover:bg-[#E9DCCF]/50"
                  aria-label="Open Navigation Menu"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="18" x2="20" y2="18"></line></svg>
                </button>
              </div>

            </div>

            {/* Mobile Drawer Menu */}
            {isMobileMenuOpen && (
              <div className="lg:hidden bg-[#FFF9F2] border-b border-[#E9DCCF] px-6 py-6 space-y-4 animate-fade-in shadow-xl">
                <div className="flex flex-col space-y-3 font-medium text-base">
                  <button onClick={() => navigateTo('home')} className="text-left py-2 border-b border-[#E9DCCF]/40">Home</button>
                  <button onClick={() => navigateTo('trending-finds', 'Beauty')} className="text-left py-2 border-b border-[#E9DCCF]/40 flex justify-between">Beauty <span>â†’</span></button>
                  <button onClick={() => navigateTo('trending-finds', 'Fashion')} className="text-left py-2 border-b border-[#E9DCCF]/40 flex justify-between">Fashion <span>â†’</span></button>
                  <button onClick={() => navigateTo('trending-finds', 'Jewellery')} className="text-left py-2 border-b border-[#E9DCCF]/40 flex justify-between">Jewellery <span>â†’</span></button>
                  <button onClick={() => navigateTo('trending-finds', 'Home Decor')} className="text-left py-2 border-b border-[#E9DCCF]/40 flex justify-between">Home Decor <span>â†’</span></button>
                  <button onClick={() => navigateTo('how-it-works')} className="text-left py-2 border-b border-[#E9DCCF]/40">How Jashviora Works</button>
                  <button onClick={() => navigateTo('pinterest-gallery')} className="text-left py-2 border-b border-[#E9DCCF]/40">Inspiration Gallery</button>
                  <button onClick={() => navigateTo('about-us')} className="text-left py-2 border-b border-[#E9DCCF]/40">About Jashviora</button>
                  <button onClick={() => { setIsMobileMenuOpen(false); setIsContactModalOpen(true); }} className="text-left py-2">Contact Us</button>
                </div>
                <div className="pt-2">
                  <button
                    onClick={() => { setIsMobileMenuOpen(false); setIsAdminView(!isAdminView); }}
                    className="w-full py-2.5 rounded-full bg-[#49372F] text-[#FFF9F2] text-sm font-medium"
                  >
                    {isAdminView ? "Return to Store" : "Open Admin Product Studio"}
                  </button>
                </div>
              </div>
            )}
          </header>

          {/* MAIN CONTENT AREA */}
          <main className="flex-grow">
            
            {/* If Admin View is Active */}
            {isAdminView ? (
              <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 animate-fade-in">
                {/* Admin Header */}
                <div className="bg-white rounded-2xl border border-[#E9DCCF] p-6 sm:p-8 mb-8 shadow-sm">
                  <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-[#E9DCCF] pb-6">
                    <div>
                      <div className="editorial-ribbon mb-2">CURATOR PORTAL</div>
                      <h1 className="font-serif text-3xl font-bold text-[#49372F]">Product Management Dashboard</h1>
                      <p className="text-sm text-[#49372F]/75 mt-1 font-sans">
                        Easily add, edit, upload images, enter prices, paste affiliate URLs, and manage all external shopping items.
                      </p>
                    </div>
                    <div className="flex flex-wrap gap-2.5">
                      <button 
                        onClick={() => { setEditingProduct(null); setAdminTab("add"); }} 
                        className="btn-primary text-sm py-2 px-4"
                      >
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        Add New Product
                      </button>
                      <button 
                        onClick={exportCatalogJSON}
                        className="btn-secondary text-sm py-2 px-4"
                        title="Export JSON backup file"
                      >
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        Export Backup
                      </button>
                      <button 
                        onClick={handleResetCatalog}
                        className="text-xs px-3 py-2 rounded-full border border-red-200 text-red-700 bg-red-50 hover:bg-red-100 transition-colors"
                      >
                        Reset Defaults
                      </button>
                    </div>
                  </div>

                  {/* Summary Metric Counters */}
                  <div className="grid grid-cols-2 sm:grid-cols-5 gap-4 pt-6">
                    <div className="bg-[#FFF9F2] p-4 rounded-xl border border-[#E9DCCF]">
                      <span className="text-xs text-[#49372F]/70 font-medium">Total Products</span>
                      <p className="font-serif text-2xl font-bold mt-1">{products.length}</p>
                    </div>
                    <div className="bg-[#FFF9F2] p-4 rounded-xl border border-[#E9DCCF]">
                      <span className="text-xs text-[#49372F]/70 font-medium">Beauty</span>
                      <p className="font-serif text-2xl font-bold mt-1 text-pink-700">
                        {products.filter(p => p.category === 'Beauty').length}
                      </p>
                    </div>
                    <div className="bg-[#FFF9F2] p-4 rounded-xl border border-[#E9DCCF]">
                      <span className="text-xs text-[#49372F]/70 font-medium">Fashion</span>
                      <p className="font-serif text-2xl font-bold mt-1 text-purple-700">
                        {products.filter(p => p.category === 'Fashion').length}
                      </p>
                    </div>

                      >
                        <span>Visit {quickViewProduct.store} & Shop Now</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                      </a>

                      <button
                        onClick={(e) => toggleWishlist(quickViewProduct.id, e)}
                        className="w-full btn-secondary text-xs py-2 flex items-center justify-center gap-1.5"
                      >
                        <span>{wishlist.includes(quickViewProduct.id) ? "â™¥ Saved in Wishlist" : "â™¡ Save to Wishlist"}</span>
                      </button>
                    </div>

                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 2. WISHLIST DRAWER MODAL */}
          {isWishlistOpen && (
            <div className="fixed inset-0 z-50 flex justify-end modal-backdrop animate-fade-in" onClick={() => setIsWishlistOpen(false)}>
              <div 
                className="w-full max-w-md bg-[#FFF9F2] h-full shadow-2xl flex flex-col justify-between p-6 sm:p-8 overflow-y-auto"
                onClick={(e) => e.stopPropagation()}
              >
                <div>
                  <div className="flex items-center justify-between pb-4 border-b border-[#E9DCCF]">
                    <div>
                      <h3 className="font-serif text-2xl font-bold text-[#49372F]">Your Saved Finds</h3>
                      <span className="text-xs text-[#49372F]/60 font-medium">{wishlist.length} items saved</span>
                    </div>
                    <button 
                      onClick={() => setIsWishlistOpen(false)}
                      className="p-1 rounded-full hover:bg-[#E9DCCF]/50 text-[#49372F]"
                    >
                      âœ•
                    </button>
                  </div>

                  {wishlist.length === 0 ? (
                    <div className="py-16 text-center">
                      <div className="w-14 h-14 rounded-full bg-[#EBCFD0]/40 flex items-center justify-center mx-auto mb-4 text-[#49372F]">
                        â™¡
                      </div>
                      <h4 className="font-serif font-bold text-lg mb-1">Your wishlist is empty</h4>
                      <p className="text-xs text-[#49372F]/70 mb-6">Explore our curated collections and save items you adore.</p>
                      <button 
                        onClick={() => { setIsWishlistOpen(false); navigateTo('trending-finds'); }}
                        className="btn-primary text-xs py-2 px-4"
                      >
                        Explore Trending Finds
                      </button>
                    </div>
                  ) : (
                    <div className="divide-y divide-[#E9DCCF]/50 mt-4 space-y-3">
                      {products.filter(p => wishlist.includes(p.id)).map(prod => (
                        <div key={prod.id} className="pt-3 flex gap-3 items-center">
                          <img 
                            src={prod.image} 
                            alt={prod.title} 
                            className="w-16 h-16 rounded-xl object-cover border border-[#E9DCCF]"
                            onError={(e) => { e.target.src = prod.fallbackImage || "/assets/collections/beauty.jpg"; }}
                          />
                          <div className="flex-1 min-w-0">
                            <span className="text-[10px] uppercase font-bold text-[#C5A059] block">{prod.store}</span>
                            <h5 className="font-serif text-sm font-bold truncate text-[#49372F]">{prod.title}</h5>
                            <span className="text-xs font-semibold text-[#49372F]">â‚¹{Number(prod.price).toLocaleString('en-IN')}</span>
                          </div>
                          <div className="flex flex-col gap-1 items-end">
                            <a
                              href={prod.externalUrl}
                              target="_blank"
                              rel="noopener noreferrer"
                              className="text-[11px] px-2.5 py-1 rounded-full bg-[#49372F] text-white font-medium"
                            >
                              Shop â†—
                            </a>
                            <button
                              onClick={() => toggleWishlist(prod.id)}
                              className="text-[10px] text-red-600 hover:underline"
                            >
                              Remove
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {wishlist.length > 0 && (
                  <div className="pt-6 border-t border-[#E9DCCF]">
                    <button
                      onClick={() => setWishlist([])}
                      className="w-full text-xs text-[#49372F]/60 hover:text-red-600 transition-colors py-2 text-center"
                    >
                      Clear Saved Wishlist
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* 3. LIVE SEARCH MODAL */}
          {isSearchOpen && (
            <div className="fixed inset-0 z-50 flex items-start justify-center pt-20 px-4 modal-backdrop animate-fade-in" onClick={() => setIsSearchOpen(false)}>
              <div 
                className="bg-white rounded-2xl border border-[#E9DCCF] max-w-2xl w-full p-6 shadow-2xl relative"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="flex items-center gap-3 border-b border-[#E9DCCF] pb-4">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                  <input
                    type="text"
                    autoFocus
                    placeholder="Search beauty, fashion, jewellery, home decor, or store..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="flex-1 text-base text-[#49372F] focus:outline-none"
                  />
                  <button onClick={() => setIsSearchOpen(false)} className="text-xs text-[#49372F]/60 hover:text-[#49372F]">
                    ESC
                  </button>
                </div>

                {/* Instant Suggestions */}
                <div className="py-4">
                  <span className="text-[11px] uppercase font-bold text-[#49372F]/50 tracking-wider block mb-2">
                    Popular Searches:
                  </span>
                  <div className="flex flex-wrap gap-2">
                    {["Brush set", "Lipstick", "Punjabi suit", "Gold hoops", "Table lamp", "Vase", "Chikankari", "Snake chain"].map(term => (
                      <button
                        key={term}
                        onClick={() => { setSearchQuery(term); }}
                        className="text-xs px-3 py-1 rounded-full bg-[#FFF9F2] border border-[#E9DCCF] text-[#49372F] hover:bg-[#E9DCCF]/50"
                      >
                        {term}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Matching Results Preview */}
                {searchQuery && (
                  <div className="max-h-72 overflow-y-auto divide-y divide-[#E9DCCF]/40 border-t border-[#E9DCCF] pt-2">
                    {filteredProducts.slice(0, 5).map(item => (
                      <div 
                        key={item.id} 
                        onClick={() => { setQuickViewProduct(item); setIsSearchOpen(false); }}
                        className="py-2.5 flex items-center justify-between cursor-pointer hover:bg-[#FFF9F2] px-2 rounded-lg"
                      >
                        <div className="flex items-center gap-3">
                          <img src={item.image} alt={item.title} className="w-10 h-10 rounded-lg object-cover" />
                          <div>
                            <span className="text-sm font-serif font-bold text-[#49372F] block leading-tight">{item.title}</span>
                            <span className="text-xs text-[#49372F]/60">{item.category} â€¢ {item.store}</span>
                          </div>
                        </div>
                        <span className="font-semibold text-xs text-[#49372F]">â‚¹{Number(item.price).toLocaleString('en-IN')}</span>
                      </div>
                    ))}
                  </div>
                )}

              </div>
            </div>
          )}

          {/* 4. CONTACT MODAL */}
          {isContactModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop animate-fade-in" onClick={() => setIsContactModalOpen(false)}>
              <div 
                className="bg-white rounded-2xl border border-[#E9DCCF] max-w-lg w-full p-6 sm:p-8 shadow-2xl relative"
                onClick={(e) => e.stopPropagation()}
              >
                <button
                  onClick={() => setIsContactModalOpen(false)}
                  className="absolute top-4 right-4 text-[#49372F]/60 hover:text-[#49372F]"
                >
                  âœ•
                </button>

                <div className="editorial-ribbon mb-2">GET IN TOUCH</div>
                <h3 className="font-serif text-2xl font-bold text-[#49372F] mb-1">Contact Jashviora</h3>
                <p className="text-xs text-[#49372F]/70 mb-6 font-sans">
                  Have a product curation suggestion, brand collaboration inquiry, or affiliate partnership? We would love to hear from you.
                </p>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  showToast("Message sent to the JASHVIORA editorial team!");
                  setIsContactModalOpen(false);
                }} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold uppercase tracking-wider mb-1 text-[#49372F]">Your Name</label>
                    <input type="text" required placeholder="Full Name" className="w-full px-4 py-2.5 rounded-xl border border-[#E9DCCF] bg-[#FFF9F2]/40 text-sm focus:outline-none focus:border-[#49372F]" />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold uppercase tracking-wider mb-1 text-[#49372F]">Your Email</label>
                    <input type="email" required placeholder="name@example.com" className="w-full px-4 py-2.5 rounded-xl border border-[#E9DCCF] bg-[#FFF9F2]/40 text-sm focus:outline-none focus:border-[#49372F]" />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold uppercase tracking-wider mb-1 text-[#49372F]">Subject</label>
                    <select className="w-full px-4 py-2.5 rounded-xl border border-[#E9DCCF] bg-[#FFF9F2]/40 text-sm focus:outline-none focus:border-[#49372F]">
                      <option>Product Recommendation</option>
                      <option>Brand Collaboration</option>
                      <option>Affiliate & Press Inquiry</option>
                      <option>General Feedback</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold uppercase tracking-wider mb-1 text-[#49372F]">Your Message</label>
                    <textarea rows="3" required placeholder="Write your message here..." className="w-full px-4 py-2.5 rounded-xl border border-[#E9DCCF] bg-[#FFF9F2]/40 text-sm focus:outline-none focus:border-[#49372F]"></textarea>
                  </div>
                  <button type="submit" className="w-full btn-primary text-sm py-2.5">
                    Send Message
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* 5. AFFILIATE & ETHICS DISCLOSURE MODAL */}
          {isAffiliateModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop animate-fade-in" onClick={() => setIsAffiliateModalOpen(false)}>
              <div 
                className="bg-white rounded-2xl border border-[#E9DCCF] max-w-xl w-full p-6 sm:p-8 shadow-2xl relative max-h-[85vh] overflow-y-auto"
                onClick={(e) => e.stopPropagation()}
              >
                <button
                  onClick={() => setIsAffiliateModalOpen(false)}
                  className="absolute top-4 right-4 text-[#49372F]/60 hover:text-[#49372F]"
                >
                  âœ•
                </button>

                <div className="editorial-ribbon mb-2">EDITORIAL TRANSPARENCY</div>
                <h3 className="font-serif text-2xl font-bold text-[#49372F] mb-4">
                  Affiliate Disclosure & Terms
                </h3>

                <div className="space-y-4 text-xs sm:text-sm text-[#49372F]/80 leading-relaxed font-sans">
                  <p>
                    <strong>Welcome to JASHVIORA.</strong> We take immense pride in maintaining complete editorial independence and trust with our readers.
                  </p>
                  <p>
                    <strong>How Our Links Work:</strong> When you click on the "Shop Now" button on any product card or inspiration pin, you are directed directly to the respective external retailer (such as Amazon India, Nykaa, Myntra, Flipkart, Meesho, or independent brand stores).
                  </p>
                  <p>
                    <strong>Affiliate Commission:</strong> In some cases, Jashviora participates in affiliate programs (including the Amazon Associates Program and partner affiliate networks). This means we may earn an affiliate commission on qualifying purchases made through our referral links.
                  </p>
                  <p>
                    <strong>No Extra Cost to You:</strong> You will never pay a single rupee extra when using our links. The price remains identical to visiting the store directly.
                  </p>
                  <p>
                    <strong>Editorial Integrity:</strong> We only feature products we genuinely believe bring aesthetic beauty, craftsmanship, and joy to your life. No retailer can buy an endorsement that doesn't meet our standards.
                  </p>
                </div>

                <div className="mt-6 pt-4 border-t border-[#E9DCCF]">
                  <button 
                    onClick={() => setIsAffiliateModalOpen(false)}
                    className="w-full btn-primary text-xs py-2.5"
                  >
                    I Understand
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 6. TOAST NOTIFICATION */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 animate-fade-in">
              <div className="bg-[#49372F] text-[#FFF9F2] px-5 py-3 rounded-xl shadow-2xl border border-[#E9DCCF]/30 flex items-center gap-3 text-xs sm:text-sm">
                <span>âœ¨</span>
                <span>{toast.message}</span>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render the React application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
